<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a2457">
<title>NK Properties | Tonk, Uniara, Aligarh Plots & Makaan</title>
<meta name="description" content="NK Properties - Buy, Sell, Rent, Invest. Plot, makaan, dukaan aur krishi bhoomi.">
<style>
:root{--navy:#071a3d;--navy2:#0a2457;--blue:#1457d6;--yellow:#ffd21f;--green:#12a33a;--card:#fff;--ink:#0d1b3a;--mut:#6b7794}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Noto Sans Devanagari",sans-serif;background:#030d24;color:#fff;min-height:100vh}
.app{max-width:600px;margin:0 auto;min-height:100vh;background:linear-gradient(180deg,var(--navy2),var(--navy) 60%,#051233);position:relative;padding-bottom:84px;overflow:hidden}
button{font:inherit;cursor:pointer;border:0}
a{color:inherit;text-decoration:none}
.hide{display:none!important}
/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 8px;position:relative;z-index:3}
.logo{display:flex;align-items:center;gap:8px;min-width:0}
.logo .mark{position:relative;display:block;padding-top:15px;flex:none}
.logo .mark svg{position:absolute;left:-6px;top:0;width:calc(100% + 12px);height:22px}
.logo .nk{display:block;font-size:44px;font-weight:900;line-height:1;letter-spacing:-2px}
.logo .tx{line-height:1.05}
.logo .tx b{display:block;color:var(--yellow);font-size:25px;font-weight:900;letter-spacing:.5px}
.logo .tx i{font-size:10.5px;font-style:italic;opacity:.9}
.hr{display:flex;align-items:center;gap:10px}
.pill{border:1.5px solid #3b82f6;border-radius:30px;padding:8px 14px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:7px;background:rgba(20,87,214,.15);color:#fff}
.burger{background:none;color:#fff;width:40px;height:40px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.burger span{height:4px;background:#fff;border-radius:3px;display:block}
.menu{position:absolute;top:70px;right:12px;background:#fff;color:var(--ink);border-radius:14px;padding:6px;z-index:20;min-width:210px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
.menu a{display:block;padding:12px 14px;border-radius:10px;font-weight:600}
.menu a:hover{background:#eef3ff}
/* hero */
.hero{position:relative;padding:18px 16px 22px;min-height:250px}
.hero h1{font-size:clamp(28px,8.4vw,44px);line-height:1.12;font-weight:800;position:relative;z-index:2;max-width:62%}
.hero h1 em{color:var(--yellow);font-style:normal;display:block;white-space:nowrap}
.hero p.hsub{position:relative;z-index:2;margin-top:12px;font-size:clamp(14px,4.2vw,20px);font-weight:600;color:#fff;line-height:1.4;max-width:70%}
.hero .art{position:absolute;right:0;top:0;width:66%;height:100%;z-index:1;-webkit-mask-image:linear-gradient(90deg,transparent,#000 38%),linear-gradient(180deg,transparent,#000 10%,#000 88%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(90deg,transparent,#000 38%),linear-gradient(180deg,transparent,#000 10%,#000 88%,transparent);mask-composite:intersect}
.hero .art svg,.hero .art img{width:100%;height:100%;display:block}
.hero .art img{object-fit:cover;object-position:60% center}
.hero .swoosh{position:absolute;left:16px;bottom:8px;width:300px;height:3px;background:linear-gradient(90deg,var(--yellow),transparent);border-radius:3px;z-index:2}
/* search card (compact) */
.sc{margin:6px 14px 0;background:#fff;color:var(--ink);border-radius:20px;padding:12px;box-shadow:0 0 0 2px rgba(59,130,246,.35),0 8px 28px rgba(20,87,214,.35);position:relative;z-index:3}
.sc h2{font-size:18px;display:flex;align-items:center;gap:8px;margin-bottom:9px;color:#10275a}
.sc h2 svg{width:30px;height:26px}
.tabs{display:flex;gap:7px}
.tabs button{flex:1;padding:9px 6px;border-radius:24px;background:#e8edf6;color:#10275a;font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.tabs button svg{width:18px;height:17px}
.tabs button.on{background:var(--blue);color:#fff}
.sel{margin-top:9px;border:1.5px solid #d3dbe9;border-radius:24px;padding:0 12px;display:flex;align-items:center;gap:8px;background:#fff}
.sel svg:first-child{width:18px;height:21px}
.sel svg:last-child{width:14px;height:9px}
.sel select{flex:1;border:0;outline:0;background:transparent;padding:10px 0;font-size:15px;color:#10275a;font-family:inherit;appearance:none;-webkit-appearance:none}
.btn-search{margin-top:9px;width:100%;padding:11px;border-radius:24px;background:linear-gradient(180deg,#1b64e8,#0d46b4);color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 12px rgba(20,87,214,.45)}
.btn-search svg{width:20px;height:20px}
/* categories */
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:26px 14px 12px}
.sec-h h3{font-size:clamp(20px,5.6vw,27px);font-weight:800;border-left:6px solid var(--yellow);padding-left:12px;line-height:1.1}
.va{border:1.5px solid #3b82f6;background:transparent;color:#fff;border-radius:30px;padding:9px 16px;font-weight:600;font-size:16px}
.cats{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 14px}
.cat{height:100px;border-radius:20px;overflow:hidden;position:relative;border:2px solid #1f4fa8;cursor:pointer;background:linear-gradient(135deg,#1d4ed8,#091e4a)}
.cat::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(3,13,40,.92))}
.cat .lb{position:absolute;left:10px;right:10px;bottom:8px;z-index:2;display:flex;align-items:center;gap:8px;font-weight:700;font-size:clamp(13px,3.8vw,17px)}
.cat .lb>span:nth-child(2){min-width:0;line-height:1.15}
.cat .lb .ic{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.95);color:#10275a;display:grid;place-items:center;flex:none}
.cat .lb .go{margin-left:auto;width:32px;height:32px;border:2px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:none}
/* trust */
.trust{margin:16px 10px 0;background:#fff;color:#10275a;border-radius:22px;display:grid;grid-template-columns:repeat(4,1fr);padding:12px 4px;box-shadow:0 0 0 2px rgba(59,130,246,.3)}
.trust div{text-align:center;font-weight:700;font-size:15px;line-height:1.15;padding:2px 4px;border-right:1.5px solid #d3dbe9;cursor:pointer}
.trust div:last-child{border:0}
.trust small{display:block;font-weight:500;font-size:12.5px;color:#41507a}
.trust svg{width:38px;height:38px;display:block;margin:0 auto 4px}
/* bottom bar */
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:600px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:12px;z-index:30;background:linear-gradient(180deg,transparent,rgba(3,13,36,.9) 40%)}
.call{flex:0 1 270px;min-width:0;background:linear-gradient(180deg,#14b53f,#0a8a2c);border-radius:40px;display:flex;align-items:center;justify-content:center;gap:9px;padding:6px 14px;box-shadow:0 0 0 2px #3ddc66 inset}
.call svg{width:clamp(24px,6vw,32px);height:clamp(24px,6vw,32px);flex:none}
.call small{display:block;font-size:clamp(10px,3vw,13px);font-weight:600;line-height:1}
.call b{white-space:nowrap;font-size:clamp(14px,4vw,21px);font-weight:800;letter-spacing:.5px;line-height:1.1}
.reg{flex:none;background:linear-gradient(180deg,#ffdc3a,#f1b800);color:#10275a;border-radius:30px;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;white-space:nowrap;line-height:1.1}
.reg svg{width:18px;height:18px;flex:none}
/* inner pages */
.page{padding:6px 14px 20px}
.back{background:rgba(255,255,255,.12);color:#fff;border-radius:30px;padding:9px 16px;font-weight:600;margin:6px 0 12px}
.page h2{font-size:26px;margin-bottom:6px}
.page .sub{color:#b9c6e6;margin-bottom:14px}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.pc{background:#fff;color:var(--ink);border-radius:20px;overflow:hidden;cursor:pointer;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.pc .im{height:170px;background:linear-gradient(135deg,#1d4ed8,#0f172a);position:relative;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:20px}
.pc .im img,.pc .im svg{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;left:10px;top:10px;background:var(--blue);color:#fff;border-radius:20px;font-size:13px;font-weight:700;padding:4px 12px}
.tag.rent{background:#f59e0b}
.pc .bd{padding:12px 14px 14px}
.pc h4{font-size:18px}
.pc .pr{color:var(--blue);font-weight:800;font-size:20px;margin:4px 0}
.pc .mt{color:var(--mut);font-size:14px}
.empty{background:rgba(255,255,255,.08);border-radius:18px;padding:30px 16px;text-align:center;color:#c8d4f0}
.chips{margin-bottom:6px}
.chipgrp{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.chips button{background:rgba(255,255,255,.12);color:#fff;border-radius:20px;padding:8px 14px;font-weight:600;font-size:14px}
.chips button.on{background:var(--yellow);color:#10275a}
/* forms */
.fm{background:#fff;color:var(--ink);border-radius:20px;padding:16px}
.fm label{display:block;font-size:13.5px;font-weight:700;margin:12px 0 5px;color:#33436e}
.fm input,.fm select,.fm textarea{width:100%;border:1.5px solid #d3dbe9;border-radius:12px;padding:12px 13px;font-size:16px;font-family:inherit;outline:none;background:#fff;color:var(--ink)}
.fm input:focus,.fm select:focus,.fm textarea:focus{border-color:var(--blue)}
.fm textarea{min-height:80px;resize:vertical}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pbtn{margin-top:16px;width:100%;padding:15px;border-radius:30px;background:var(--blue);color:#fff;font-weight:800;font-size:18px}
.pbtn.g{background:var(--green)}.pbtn.r{background:#d92d3a}.pbtn.y{background:var(--yellow);color:#10275a}
.photos{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.photos .ph{width:84px;height:84px;border-radius:12px;overflow:hidden;position:relative;background:#eef}
.photos .ph img{width:100%;height:100%;object-fit:cover}
.photos .ph b{position:absolute;right:3px;top:3px;background:#d92d3a;color:#fff;border-radius:50%;width:22px;height:22px;display:grid;place-items:center;font-size:13px;cursor:pointer}
.addph{width:84px;height:84px;border:2px dashed #9db3e0;border-radius:12px;display:grid;place-items:center;color:#4a62a8;font-size:12px;text-align:center;cursor:pointer;font-weight:700}
.note{font-size:12.5px;color:var(--mut);margin-top:10px}
/* modal */
.mo{position:fixed;inset:0;background:rgba(2,8,24,.78);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.mo .bx{background:#fff;color:var(--ink);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding:18px 16px 24px;position:relative}
.mo .x{position:absolute;right:12px;top:10px;background:#eef2fb;color:#10275a;width:36px;height:36px;border-radius:50%;font-size:20px;font-weight:700;z-index:2}
.mo h3{font-size:22px;margin:0 40px 8px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0;font-size:15px}
.kv span{color:var(--mut)}
/* admin */
.atabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px;padding-bottom:4px}
.atabs button{background:rgba(255,255,255,.12);color:#fff;border-radius:20px;padding:9px 14px;font-weight:700;font-size:14px;white-space:nowrap}
.atabs button.on{background:var(--yellow);color:#10275a}
.atabs b{background:#d92d3a;color:#fff;border-radius:10px;padding:0 7px;margin-left:5px;font-size:12px}
.ar{background:#fff;color:var(--ink);border-radius:16px;padding:12px;margin-bottom:12px;display:flex;gap:12px}
.ar .th{width:84px;height:84px;border-radius:12px;overflow:hidden;flex:none;background:#1e3a8a;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;text-align:center}
.ar .th img,.ar .th svg{width:100%;height:100%;object-fit:cover}
.ar .in{flex:1;min-width:0}
.ar h4{font-size:16px}
.ar .mt{font-size:13px;color:var(--mut);margin:2px 0}
.st{display:inline-block;border-radius:10px;padding:2px 9px;font-size:12px;font-weight:800}
.st.pending{background:#fff1c9;color:#8a5b00}.st.approved{background:#d4f5de;color:#0c6b2a}.st.rejected{background:#fde0e2;color:#a0212d}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.acts button{border-radius:10px;padding:7px 11px;font-size:13px;font-weight:700;background:#eef2fb;color:#10275a}
.acts .ok{background:#d4f5de;color:#0c6b2a}.acts .no{background:#fde0e2;color:#a0212d}
.awarn{background:#fff1c9;color:#6b4300;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:14px;line-height:1.45;font-weight:600}
.awarn.ok{background:#d4f5de;color:#0c6b2a}
.toast{position:fixed;left:50%;bottom:120px;transform:translateX(-50%);background:#10275a;color:#fff;padding:12px 20px;border-radius:30px;z-index:99;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.5);max-width:90%;text-align:center}
.sellgrid{display:grid;grid-template-columns:1fr;gap:16px}
.sinfo{background:#12305a;border-radius:18px;padding:22px 20px;line-height:1.5}
.sinfo h2{color:#ffe08a;font-size:23px;line-height:1.4;margin-bottom:12px}
.sinfo p{font-size:15px;margin-bottom:14px}
.sinfo ul{list-style:none;margin-bottom:14px}
.sinfo li{font-weight:600;margin:10px 0;font-size:15px}
.sinfo li::before{content:"✓ ";color:#ffd21f;font-weight:900}
.sform label{font-size:12.5px;color:#1a2442;margin-top:14px}
.sform .r2 label{margin-top:14px}
.sform input,.sform select,.sform textarea{padding:11px 12px;font-size:15px;border-radius:8px;border:1px solid #cfd6e4}
.sform textarea{min-height:76px}
.photos.wide{display:block}
.photos.wide .row2{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.addph.wide{width:100%;height:auto;display:flex;align-items:center;gap:8px;justify-content:flex-start;padding:11px 14px;background:#eaf1fb;border:1.5px dashed #1f3f73;border-radius:8px;color:#10275a;font-size:14px}
.cnt{font-size:12.5px;color:#41507a;margin-top:6px}
.sbtn{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:10px;background:linear-gradient(180deg,#25d366,#0f9a46);font-size:17px}
.sub2{padding:0 14px;color:#b9c6e6;margin:-4px 0 12px}
.areas{display:flex;flex-wrap:wrap;gap:10px;padding:0 14px}
.areas button{background:rgba(255,255,255,.1);border:1.5px solid #3b82f6;color:#fff;border-radius:30px;padding:11px 18px;font-weight:700;font-size:16px}
.cta{margin:22px 14px 0;background:linear-gradient(180deg,#0d3a8a,#0a2457);border:2px solid #1f4fa8;border-radius:22px;padding:20px 16px;text-align:center}
.cta h3{font-size:24px;margin-bottom:6px}
.cta p{color:#c8d4f0;margin-bottom:4px}
.cta .pbtn{display:block;text-decoration:none}
.langbar{display:flex;justify-content:flex-end;align-items:center;gap:6px;padding:0 14px 6px;position:relative;z-index:3}
.langbar span{font-size:15px;opacity:.85}
.langbar button{background:rgba(255,255,255,.12);color:#fff;border-radius:16px;padding:5px 12px;font-weight:700;font-size:13px;border:1px solid transparent}
.langbar button.on{background:var(--yellow);color:#10275a}
html{scroll-behavior:smooth}
body{overflow-x:hidden}
@media(max-width:480px){
 header{padding:12px 10px 6px;gap:6px}
 .logo{gap:5px}
 .logo .mark{padding-top:13px}
 .logo .mark svg{height:19px}
 .logo .nk{font-size:32px;letter-spacing:-1px}
 .logo .tx b{font-size:18px}
 .logo .tx i{font-size:8px;white-space:nowrap}
 .hr{gap:4px}
 .reg{font-size:12.5px;padding:7px 10px;gap:4px}
 .reg svg{width:15px;height:15px}
 .burger{width:32px;height:32px;gap:5px}.burger span{height:3px}
 .menu{top:60px}
 .cat{height:92px}
 .cat .lb{left:8px;right:8px;gap:6px}
 .cat .lb .ic{width:28px;height:28px}.cat .lb .go{width:26px;height:26px;font-size:14px}
 .trust div{font-size:12.5px}.trust small{font-size:10.5px}.trust svg{width:30px;height:30px}
 .va{padding:7px 11px;font-size:14px}
}
@media(max-width:699px){.hero .art{width:62%}.hero h1,.hero p.hsub{max-width:62%}.pill{display:none}}
@media(max-width:380px){.logo .tx i{display:none}.logo .nk{font-size:28px}.reg svg{display:none}}
@media(min-width:700px){
 .app{max-width:900px}
 .cats{grid-template-columns:repeat(4,1fr)}
 .cat{height:150px}
 .grid{grid-template-columns:repeat(2,1fr)}
 .hero{min-height:340px;padding:30px 24px}
 .hero h1{font-size:50px;max-width:52%}
 .hero p.hsub{font-size:22px;max-width:52%}
 .sc{margin:6px 24px 0;padding:14px 16px 14px}
 .sec-h,.cats,.areas,.sub2{padding-left:24px;padding-right:24px}
 .cta{margin-left:24px;margin-right:24px}
 .trust{margin:20px 24px 0}
 .page{padding:6px 24px 24px}
 .sellgrid{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);align-items:start}
 .sinfo{position:sticky;top:12px}
}
@media(min-width:1000px){.app{max-width:1100px}.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="app" id="app">

<header>
  <a class="logo" href="#home">
    <span class="mark">
      <svg viewBox="0 0 100 24" preserveAspectRatio="none"><path d="M3 22 50 3l47 19" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><g fill="#fff"><rect x="44" y="9" width="5" height="5"/><rect x="51" y="9" width="5" height="5"/><rect x="44" y="16" width="5" height="5"/><rect x="51" y="16" width="5" height="5"/></g></svg>
      <span class="nk">NK</span>
    </span>
    <span class="tx"><b>PROPERTIES</b><i>Dream • Buy • Sell • Rent • Invest</i></span>
  </a>
  <div class="hr">
    <span class="pill"><svg width="22" height="24" viewBox="0 0 24 26"><path d="M12 1 2 5v8c0 6 4.5 10 10 12 5.5-2 10-6 10-12V5z" fill="#22c55e"/><path d="m7 13 3.5 3.5L17 10" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/></svg>Property Portal</span>
    <button class="reg" id="regBtn"><svg width="30" height="30" viewBox="0 0 30 30"><circle cx="12" cy="9" r="6" fill="#10275a"/><path d="M1 28c0-8 5-11 11-11s11 3 11 11z" fill="#10275a"/><path d="M24 4v8M20 8h8" stroke="#10275a" stroke-width="3" stroke-linecap="round"/></svg><span>Register / Login</span></button>
    <button class="burger" id="burger" aria-label="Menu"><span></span><span></span><span></span></button>
  </div>
  <div class="menu hide" id="menu">
    <a href="#home">🏠 Home</a>
    <a href="#list">🔎 Sabhi Properties</a>
    <a href="#sell">📝 Apni Property Daalein</a>
    <a href="#agent">🧑‍💼 Agent Panel</a>
    <a href="#admin">🔐 Admin Panel</a>
  </div>
</header>

<div class="langbar" role="group" aria-label="Language">
  <span>🌐</span>
  <button class="on" data-l="hing">Hinglish</button>
  <button data-l="hi">हिंदी</button>
  <button data-l="en">English</button>
</div>

<!-- HOME -->
<main id="v-home">
  <section class="sc">
    <h2><svg width="46" height="40" viewBox="0 0 46 40"><path d="M3 20 23 3l20 17" fill="none" stroke="#1457d6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 18v18h28V18L23 7z" fill="#1457d6"/><rect x="19" y="24" width="8" height="12" fill="#fff"/></svg><span>Aap kya dhundh rahe hain?</span></h2>
    <div class="tabs" id="ptabs">
